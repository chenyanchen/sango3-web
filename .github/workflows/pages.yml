# Generates the original asset set (tools/gen: art, data, maps, audio — no
# copyrighted content), builds the game and deploys it to GitHub Pages.
# Players who own the original game can additionally import it in the browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CJK fonts for calligraphy in generated art
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-arphic-ukai >/dev/null
      - name: Cache generated assets
        id: gencache
        uses: actions/cache@v4
        with:
          path: public/assets
          key: gen-${{ hashFiles('tools/gen/**', 'src/extract/pipeline.ts', 'pnpm-lock.yaml') }}
      - name: Generate assets
        if: steps.gencache.outputs.cache-hit != 'true'
        run: pnpm gen
      - run: pnpm build
      - name: Ensure only generated assets are published
        run: test -f dist/assets/version.json && test ! -e dist/assets-orig
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
